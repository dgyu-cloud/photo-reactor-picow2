[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
board_build.core = earlephilhower
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
build_flags =
    -Wl,-u,_printf_float
    -Iinclude
board_build.filesystem_size = 1.5m
build_src_filter = +<*> -<sensor_debug.cpp>
lib_deps =
    adafruit/Adafruit MAX31855 library @ ^1.4.2
    adafruit/Adafruit SSD1306 @ ^2.5.13

[env:sensor-debug]
extends = env:pico
build_src_filter = +<sensor_debug.cpp>
